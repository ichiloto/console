name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Composer, syntax, PHPStan and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out Console
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Check PHP 8.4 source syntax
        run: |
          find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l bin/ichiloto

      - name: Run PHPStan
        run: composer analyse -- --no-progress

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

  tests:
    name: Tests (${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            php: '8.4'
          - os: ubuntu-24.04
            php: '8.5'
          - os: macos-15
            php: '8.4'

    steps:
      - name: Check out Console
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run portable test suite
        run: composer test
